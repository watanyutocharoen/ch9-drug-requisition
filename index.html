<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกยาห้องยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#17201d; --muted:#5d6b66; --line:#dfe5e2; --soft:#eef3f1;
  --pri:#0e6b5c; --pri-ink:#fff; --pri-soft:#e1f1ed;
  --warn:#b45309; --warn-soft:#fdf1e2; --bad:#b42318; --bad-soft:#fdecea; --ok:#15803d; --ok-soft:#e5f5ea;
  --info:#1d4ed8; --info-soft:#e7eefc; --tam:#7c3aed; --tam-soft:#f1eafd;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
/* layout */
header.top{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top .brand{font-weight:700;font-size:17px;line-height:1.2}
header.top .brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
header.top .sp{flex:1}
header.top .who{font-size:13px;text-align:right;line-height:1.25}
header.top .who b{font-weight:600}
.btn-h{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn-h:hover{background:rgba(255,255,255,.24)}
nav.rooms{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto;position:sticky;top:56px;z-index:15}
nav.rooms a{padding:11px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.rooms a.on{color:var(--pri);border-bottom-color:var(--pri)}
nav.rooms .sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);font-size:14px}
.tabs a.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f3c3be}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-submitted{background:var(--warn-soft);color:var(--warn)}
.st-approved{background:var(--info-soft);color:var(--info)}
.st-received{background:var(--ok-soft);color:var(--ok)}
.st-cancelled{background:#eee;color:#777}
.chip.tam{background:var(--tam-soft);color:var(--tam)}
.chip.buy{background:var(--warn-soft);color:var(--warn)}
.chip.main{background:var(--soft);color:var(--muted)}
.chip.short{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:70vh;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{background:#f7f9f8;position:sticky;top:0;z-index:1;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:#fafcfb}
table.t tr.neg td{background:#fff7f6}
table.t td .nm{font-size:13px}
table.t td .cd{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600}
table.t input.q{width:78px;text-align:right;padding:4px 6px}
table.t input.q.chg{background:#fff8e6;border-color:var(--warn)}
td.big{font-weight:700;font-size:15px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.clickrow{cursor:pointer}
/* login */
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .card{padding:26px}
.login h1{font-size:22px;margin:0 0 2px}
.login .lg{width:52px;height:52px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;margin-bottom:12px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 30px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,25,22,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 12px;font-size:19px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17201d;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:#7a3d06}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.ac{position:relative}
.ac .list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;z-index:30}
.ac .it{padding:7px 10px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--soft)}
.ac .it:hover,.ac .it.on{background:var(--pri-soft)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:6px 0 2px}
.steps span{padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.steps span.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.steps span.done{background:var(--ok-soft);color:var(--ok)}
/* print */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:'Sarabun','IBM Plex Sans Thai',sans-serif;font-size:13px;color:#000}
  .pf{page-break-after:always}
  .pf:last-child{page-break-after:auto}
  .pf h1{text-align:center;font-size:18px;margin:0 0 8px}
  .pf .hd{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:8px;font-size:13px}
  .pf table{width:100%;border-collapse:collapse}
  .pf th,.pf td{border:1px solid #000;padding:3px 5px;font-size:12.5px}
  .pf th{background:#eee}
  .pf td.n{text-align:right}
  .pf td.c{text-align:center}
  .pf thead{display:table-header-group}
  .pf tr{page-break-inside:avoid}
  .pf .sig{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px;text-align:center;font-size:12.5px;page-break-inside:avoid}
  .pf .sig div{padding-top:28px;border-top:1px dotted #000}
  .pf .ft{margin-top:8px;font-size:11px;color:#444;display:flex;justify-content:space-between}
}
@media (max-width:700px){
  header.top{position:static}
  header.top .who{text-align:left;order:3;width:100%}
  nav.rooms{top:0}
  main{padding:12px}
  .card{padding:13px}
  table.t{font-size:13px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด…</div></div>
<div id="print"></div>
<script>
'use strict';
const API = 'https://ujqjgqkjocdtlgvrydae.supabase.co/functions/v1/drugreq';
const HOSPITAL = 'โรงพยาบาลจุฬารัตน์ 9 แอร์พอร์ต';
const ROLE_TH = {user:'เจ้าหน้าที่', pharm:'เภสัชกร', admin:'ผู้ดูแลระบบ'};
const ST_TH = {submitted:'รอเภสัชกรตรวจ', approved:'อนุมัติแล้ว รอรับยา', received:'รับยาแล้ว', cancelled:'ยกเลิก'};
const RANK = {user:1, pharm:2, admin:3};
const FORMS = [
  {key:'main', sup:'main', buy:false, title:'ใบเบิกยา / เวชภัณฑ์', from:'เภสัชกรรม (คลังยา/เวชภัณฑ์)', short:'คลังยา'},
  {key:'mainbuy', sup:'main', buy:true, title:'ใบเบิกยา / เวชภัณฑ์ (ขอซื้อ)', from:'เภสัชกรรม (คลังยา/เวชภัณฑ์)', short:'คลังยา-ขอซื้อ'},
  {key:'tam', sup:'tam', buy:false, title:'ใบเบิกยา / เวชภัณฑ์', from:'เภสัชกรรม (คลังยา/เวชภัณฑ์-ไทยแอมดอน)', short:'TAM'},
  {key:'tambuy', sup:'tam', buy:true, title:'ใบเบิกยา / เวชภัณฑ์ (ขอซื้อ)', from:'เภสัชกรรม (คลังยา/เวชภัณฑ์-ไทยแอมดอน)', short:'TAM-ขอซื้อ'},
];

// ---------- utils ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => { if (v === null || v === undefined || v === '') return ''; const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('th-TH', {maximumFractionDigits:2}) : esc(v); };
const thDate = d => { if (!d) return '-'; const x = new Date(String(d).length <= 10 ? d + 'T00:00:00' : d); return isNaN(x) ? '-' : x.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}); };
const thDateTime = d => { if (!d) return '-'; const x = new Date(d); return isNaN(x) ? '-' : x.toLocaleString('th-TH', {day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit'}); };
const isoDate = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
async function sha256(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
const pwHash = (id, pw) => sha256('ch9sup|' + id + '|' + pw);
function toast(msg, bad){ const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2600); }
const ERR = {
  auth:'หมดเวลาการเข้าระบบ กรุณาเข้าใหม่', forbidden:'ไม่มีสิทธิ์ทำรายการนี้', bad_status:'สถานะรอบเบิกเปลี่ยนไปแล้ว ลองรีเฟรชหน้า',
  bad_pw:'รหัสผ่านไม่ถูกต้อง', no_user:'ไม่พบรหัสพนักงานนี้', locked:'ใส่รหัสผิดหลายครั้ง ถูกล็อก 10 นาที', last_admin:'ต้องมีผู้ดูแลระบบอย่างน้อย 1 คน',
  bad_qty:'จำนวนไม่ถูกต้อง', in_round:'รายการนี้ถูกรวมในรอบเบิกแล้ว ลบไม่ได้', network:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต',
};
function errText(c){ c = String(c || ''); if (c.startsWith('open_round:')) return `ห้องนี้มีรอบเบิกที่รอเภสัชกรตรวจอยู่ (รอบ #${c.split(':')[1]}) ต้องอนุมัติหรือยกเลิกก่อนสร้างรอบใหม่`; if (c.startsWith('unknown_drug:')) return 'ไม่พบรหัสยา ' + c.split(':')[1]; return ERR[c] || ('เกิดข้อผิดพลาด: ' + c); }

// ---------- state & api ----------
const S = { token: ls.get('fs_token'), user: null, rooms: [], drugs: new Map(), names: {}, cache: {} };
async function api(a, data = {}){
  let r;
  try { r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({a, token:S.token, ...data})}); }
  catch { throw new Error('network'); }
  const j = await r.json().catch(() => ({ok:false, code:'bad_response'}));
  if (!j.ok){ if (j.code === 'auth' && a !== 'login'){ logout(true); } throw new Error(j.code || 'error'); }
  return j;
}
const can = r => S.user && RANK[S.user.role] >= RANK[r];
const drug = c => S.drugs.get(c) || {code:c, name:'(ไม่พบในรายการยา)', pack:1, unit:'', supplier:'main', buy:false};
const who = id => id ? (S.names[id] || id) : '-';
const roomName = c => (S.rooms.find(r => r.code === c) || {}).name || c;

async function boot(){
  let cached = null;
  try { cached = JSON.parse(ls.get('fs_drugs') || 'null'); } catch {}
  const since = cached && cached.max ? cached.max : 0;
  const b = await api('boot', since ? {since} : {});
  S.user = b.user; S.rooms = b.rooms.filter(r => r.active); S.allRooms = b.rooms; S.names = b.names || {};
  const map = new Map();
  if (!b.full && cached) for (const d of cached.list) map.set(d.code, d);
  let max = since;
  for (const d of b.drugs){ d.pack = Number(d.pack) || 1; d.u = Number(d.u); map.set(d.code, d); if (d.u > max) max = d.u; }
  if (map.size !== b.drugCount && since){ ls.del('fs_drugs'); return boot(); }
  S.drugs = map;
  ls.set('fs_drugs', JSON.stringify({max, list:[...map.values()]}));
}
function logout(expired){ S.token = null; S.user = null; ls.del('fs_token'); if (expired) toast(ERR.auth, true); location.hash = ''; render(); }

// ---------- formula (เหมือนคอลัมน์ U ใน Excel) ----------
function suggest(G, K, L, D){ if (!(G > 0)) return 0; const rem = K - L; if (D > G) return rem > G/2 ? 0 : 1; if (G - rem <= 0) return 0; return Math.round((G - rem) / D); }

// ---------- routing ----------
window.addEventListener('hashchange', render);
function route(){
  const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  return p;
}
function go(h){ if (location.hash === h) render(); else location.hash = h; }

async function render(){
  const app = $('#app');
  if (!S.token){ app.innerHTML = loginView(); bindLogin(); return; }
  if (!S.user){
    app.innerHTML = '<div class="loading">กำลังโหลดข้อมูล…</div>';
    try { await boot(); } catch (e){ if (S.token) app.innerHTML = `<div class="login"><div class="card"><p class="err">${esc(errText(e.message))}</p><button class="btn" onclick="location.reload()">ลองใหม่</button> <button class="btn" onclick="logout()">ออกจากระบบ</button></div></div>`; return; }
    if (S.user.mustChange){ app.innerHTML = shell(''); changePwModal(true); return; }
  }
  const p = route();
  if (!p[0]){ const last = ls.get('fs_room'); const r = S.rooms.find(x => x.code === last) || S.rooms[0]; go(r ? `#/room/${r.code}/rounds` : '#/admin/drugs'); return; }
  let body = '', after = null;
  try {
    if (p[0] === 'room'){ ls.set('fs_room', p[1]); [body, after] = await roomView(p[1], p[2] || 'rounds'); }
    else if (p[0] === 'round'){ [body, after] = await roundView(Number(p[1])); }
    else if (p[0] === 'new'){ [body, after] = await newRoundView(p[1]); }
    else if (p[0] === 'admin'){ [body, after] = await adminView(p[1] || 'drugs'); }
    else body = '<div class="empty">ไม่พบหน้า</div>';
  } catch (e){ body = `<div class="card"><p class="err">${esc(errText(e.message))}</p></div>`; }
  app.innerHTML = shell(body, p);
  if (after) after();
}

function shell(body, p = []){
  const cur = p[0] === 'room' || p[0] === 'new' ? p[1] : (p[0] === 'round' ? S.curRoundRoom : null);
  return `
  <header class="top">
    <div class="brand">ระบบเบิกยาห้องยา<small>แผนกเภสัชกรรม ${HOSPITAL}</small></div>
    <div class="sp"></div>
    <div class="who"><b>${esc(S.user ? (S.user.first + ' ' + S.user.last) : '')}</b><br>${S.user ? ROLE_TH[S.user.role] : ''}</div>
    <button class="btn-h" onclick="changePwModal()">เปลี่ยนรหัสผ่าน</button>
    <button class="btn-h" onclick="logout()">ออก</button>
  </header>
  <nav class="rooms">
    ${S.rooms.map(r => `<a href="#/room/${encodeURIComponent(r.code)}/rounds" class="${cur === r.code ? 'on' : ''}">${esc(r.name)}</a>`).join('')}
    <span class="sp"></span>
    ${can('admin') ? `<a href="#/admin/drugs" class="${p[0] === 'admin' ? 'on' : ''}">⚙︎ ตั้งค่าระบบ</a>` : ''}
  </nav>
  <main>${body}</main>
  <footer>Design &amp; Developed by ภก.วทัญญู โตเจริญนิรัติศัย</footer>`;
}

// ---------- login ----------
function loginView(){
  return `<div class="login"><div class="card">
    <div class="lg">Rx</div>
    <h1>ระบบเบิกยาห้องยา</h1>
    <div class="sub">แผนกเภสัชกรรม ${HOSPITAL}</div>
    <form id="lf">
      <label class="f">รหัสพนักงาน<input type="text" id="lid" inputmode="numeric" autocomplete="username" required></label>
      <label class="f">รหัสผ่าน<input type="password" id="lpw" autocomplete="current-password" required></label>
      <div class="err" id="lerr"></div>
      <button class="btn pri" style="justify-content:center">เข้าสู่ระบบ</button>
      <div class="sub">ใช้รหัสเดียวกับระบบเบิกพัสดุห้องยา</div>
    </form>
  </div></div><footer>Design &amp; Developed by ภก.วทัญญู โตเจริญนิรัติศัย</footer>`;
}
function bindLogin(){
  $('#lf').onsubmit = async e => {
    e.preventDefault();

function drugPicker(id, ph = 'พิมพ์รหัสหรือชื่อยา'){
  return `<div class="ac" id="${id}"><input type="search" placeholder="${ph}" autocomplete="off" style="width:100%"><div class="list hidden"></div></div>`;
}
function bindPicker(id, onPick){
  const box = $('#' + id), inp = $('input', box), list = $('.list', box);
  let items = [], idx = -1;
  const show = () => {
    const q = inp.value.trim().toUpperCase();
    if (!q){ list.classList.add('hidden'); return; }
    items = [];
    for (const d of S.drugs.values()){
      if (!d.active) continue;
      const c = d.code, n = d.name.toUpperCase();
      const s = c === q ? 0 : c.startsWith(q) ? 1 : n.startsWith(q) ? 2 : (c.includes(q) || n.includes(q)) ? 3 : 9;
      if (s < 9) items.push([s, d]);
    }
    items.sort((a,b) => a[0]-b[0] || a[1].code.localeCompare(b[1].code));
    items = items.slice(0, 30).map(x => x[1]); idx = items.length ? 0 : -1;
    list.innerHTML = items.length ? items.map((d,i) => `<div class="it ${i === idx ? 'on' : ''}" data-i="${i}"><span class="cd">${esc(d.code)}</span> · ${esc(d.name)} <span class="sub">(${esc(d.unit || '')})</span></div>`).join('') : '<div class="it sub">ไม่พบ</div>';
    list.classList.remove('hidden');
  };
  const pick = d => { inp.value = `${d.code} · ${d.name}`; inp.dataset.code = d.code; list.classList.add('hidden'); onPick && onPick(d); };
  inp.addEventListener('input', () => { delete inp.dataset.code; show(); });
  inp.addEventListener('keydown', e => {
    if (list.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); idx = Math.max(0, Math.min(items.length-1, idx + (e.key === 'ArrowDown' ? 1 : -1))); $$('.it', list).forEach((x,i) => x.classList.toggle('on', i === idx)); }
    if (e.key === 'Enter' && idx >= 0){ e.preventDefault(); pick(items[idx]); }
    if (e.key === 'Escape') list.classList.add('hidden');
  });
  list.addEventListener('mousedown', e => { const it = e.target.closest('.it[data-i]'); if (it){ e.preventDefault(); pick(items[+it.dataset.i]); } });
  inp.addEventListener('blur', () => setTimeout(() => list.classList.add('hidden'), 150));
  return { get code(){ return inp.dataset.code || ''; }, clear(){ inp.value = ''; delete inp.dataset.code; }, focus(){ inp.focus(); } };
}

// ---------- report ----------
async function loadReport(room, n){
  const el = $('#rep');
  try {
    const r = await api('usageReport', {room, n});
    const fx = new Map(S.cache.room.fixed.map(f => [f.code, f.qty]));
    const low = Number(ls.get('fs_low') || 1.5), high = Number(ls.get('fs_high') || 6);
    const rows = [];
    const codes = new Set([...fx.keys(), ...r.rows.map(x => x.code)]);
    const um = new Map(r.rows.map(x => [x.code, x]));
    for (const c of codes){
      const u = um.get(c) || {avg:0,min:0,max:0,short:0,rounds:0}, f = fx.get(c) || 0;
      const cover = u.avg > 0 ? f / u.avg : null;
      let flag = '';
      if (f > 0 && u.avg > 0 && cover < low) flag = 'low'; else if (f > 0 && r.rounds >= 4 && (u.avg === 0 || cover > high)) flag = 'high'; else if (!f && u.avg > 0) flag = 'nofix';
      if (u.short) flag = flag || 'low';
      rows.push({...drug(c), f, ...u, cover, flag});
    }
    S.cache.rep = rows;
    el.innerHTML = `<div class="card">
      <div class="row"><div class="grow"><h3 style="margin:0">ยอดใช้ย้อนหลัง</h3><div class="sub">คิดจาก ${r.rounds} รอบล่าสุดที่อนุมัติแล้ว · "พอใช้" = Fixed ÷ ยอดใช้เฉลี่ยต่อรอบ (สัปดาห์)${r.rounds < 4 ? ' · ข้อสังเกต "Fixed มากไป" จะเริ่มแสดงเมื่อมีครบ 4 รอบ' : ''}</div></div>
      <label class="f">จำนวนรอบ<select id="rn">${[4,8,12,26].map(x => `<option ${x === n ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="f">พอใช้น้อยกว่า (สัปดาห์)<input type="number" id="rl" value="${low}" step="0.5" style="width:90px"></label>
      <label class="f">พอใช้มากกว่า (สัปดาห์)<input type="number" id="rh" value="${high}" step="0.5" style="width:90px"></label></div>
      ${r.rounds ? '' : '<div class="note warn" style="margin-top:10px">ยังไม่มีรอบที่อนุมัติ รายงานจะมีข้อมูลหลังอนุมัติรอบแรก</div>'}
      <div class="row" style="margin-top:12px"><div class="seg" id="rf"><button class="on" data-f="flag">ควรทบทวน</button><button data-f="low">Fixed น้อยไป/เคยขาด</button><button data-f="high">Fixed มากไป</button><button data-f="nofix">มียอดใช้แต่ไม่มี Fixed</button><button data-f="all">ทั้งหมด</button></div>
      <input type="search" id="rs" placeholder="ค้นหา" class="grow"><button class="btn sm" id="rx">ส่งออก Excel</button></div>
    </div>
    <div class="card" style="padding:0"><div class="tw" style="border:0"><table class="t"><thead><tr><th>รหัส</th><th>รายการ</th><th class="n">Fixed</th><th class="n">ใช้เฉลี่ย</th><th class="n">ต่ำสุด</th><th class="n">สูงสุด</th><th class="n">พอใช้ (สัปดาห์)</th><th class="n">ครั้งที่ขาด</th><th>ข้อสังเกต</th></tr></thead><tbody id="rb"></tbody></table></div></div>`;
    let f = 'flag';
    const FL = {low:'<span class="chip short">Fixed น้อยไป</span>', high:'<span class="chip main">Fixed มากไป</span>', nofix:'<span class="chip buy">ไม่มี Fixed</span>'};
    const draw = () => {
      const q = $('#rs').value.trim().toUpperCase();
      const list = S.cache.rep.filter(x => (f === 'all' || (f === 'flag' ? x.flag : x.flag === f)) && (!q || x.code.includes(q) || x.name.toUpperCase().includes(q))).sort((a,b) => a.code.localeCompare(b.code));
      $('#rb').innerHTML = list.length ? list.map(x => `<tr><td class="cd">${esc(x.code)}</td><td class="nm">${esc(x.name)}</td><td class="n">${fmt(x.f)}</td><td class="n">${fmt(Math.round(x.avg*10)/10)}</td><td class="n">${fmt(x.min)}</td><td class="n">${fmt(x.max)}</td><td class="n">${x.cover === null ? '-' : fmt(Math.round(x.cover*10)/10)}</td><td class="n">${x.short || ''}</td><td>${FL[x.flag] || ''}</td></tr>`).join('') : '<tr><td colspan="9" class="empty">ไม่มีรายการ</td></tr>';
    };
    $$('#rf button').forEach(b => b.onclick = () => { f = b.dataset.f; $$('#rf button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
    $('#rs').oninput = draw; draw();

function exportXlsx(name, aoa){

// ---------- Excel import helpers ----------
const norm = v => String(v ?? '').replace(/\s+/g, ' ').trim();
const toNum = v => { if (typeof v === 'number') return v; const t = String(v ?? '').replace(/,/g, '').trim(); return t === '' ? NaN : Number(t); };
async function readBook(file){
  if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)');
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, {type:'array', cellDates:true});
}
function sheetRows(wb, name){ return XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:'', blankrows:false}); }
function guessHeader(rows){
  let best = 0, score = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++){
    const r = rows[i] || [];
    const txt = r.filter(v => typeof v === 'string' && v.trim() && isNaN(Number(v))).length;
    const kw = r.filter(v => /รหัส|code|จำนวน|qty|quantity|ชื่อ|รายละเอียด|หน่วย|fixed|uom/i.test(String(v))).length;
    const s = txt + kw * 3;
    if (s > score){ score = s; best = i; }
  }
  return best;
}
function colScores(rows, hdr){
  const head = rows[hdr] || [], width = Math.max(...rows.slice(hdr, hdr + 200).map(r => r.length), head.length);
  const cols = [];
  for (let c = 0; c < width; c++){
    let codeHit = 0, numHit = 0, filled = 0;
    for (let i = hdr + 1; i < Math.min(rows.length, hdr + 400); i++){
      const v = (rows[i] || [])[c]; if (v === '' || v === null || v === undefined) continue;
      filled++;
      if (S.drugs.has(String(v).trim().toUpperCase())) codeHit++;
      if (Number.isFinite(toNum(v))) numHit++;
    }
    cols.push({c, name: norm(head[c]) || `คอลัมน์ ${XLSX.utils.encode_col(c)}`, codeHit, numHit, filled});
  }
  return cols;
}
function autoMap(cols, fields){
  const map = {};
  const used = new Set();
  // รหัสยา: คอลัมน์ที่ตรงกับรหัสในระบบมากที่สุด
  if (fields.code){ const c = [...cols].sort((a,b) => b.codeHit - a.codeHit || (/รหัส|code/i.test(b.name) - /รหัส|code/i.test(a.name)))[0]; if (c){ map.code = c.c; used.add(c.c); } }
  for (const [k, re] of Object.entries(fields)){
    if (k === 'code' || !re) continue;
    for (const rx of (Array.isArray(re) ? re : [re])){
      const c = cols.find(x => !used.has(x.c) && rx.test(x.name) && (!['qty','pack'].includes(k) || x.numHit > 0));
      if (c){ map[k] = c.c; used.add(c.c); break; }
    }
  }
  return map;
}
/* importWizard: เลือกไฟล์ → ชีต → แถวหัวตาราง → จับคู่คอลัมน์ → คืนค่า rows [{field: value}] */
function importWizard({title, fields, labels, required, note, extra = '', onRows}){
  const m = modal(`<h2>${esc(title)}</h2>
    ${note ? `<div class="note" style="margin-bottom:12px">${note}</div>` : ''}
    <div class="grid2"><label class="f">ไฟล์ Excel / CSV<input type="file" id="wf" accept=".xlsx,.xls,.csv"></label>
    <label class="f">ชีต<select id="ws" disabled></select></label></div>
    <div id="wm" style="margin-top:12px"></div>
    ${extra}
    <div class="err" id="we" style="margin-top:8px"></div>
    <div class="row end" style="margin-top:12px"><button class="btn" id="wc">ยกเลิก</button><button class="btn pri" id="wo" disabled>นำเข้า</button></div>`);
  let wb = null, rows = [], hdr = 0, map = {}, fileName = '';
  $('#wc', m).onclick = () => m.close();
  const drawMap = () => {
    const cols = colScores(rows, hdr);
    if (!Object.keys(map).length) map = autoMap(cols, fields);
    const opt = (k) => `<option value="">— ไม่ใช้ —</option>` + cols.map(c => `<option value="${c.c}" ${map[k] === c.c ? 'selected' : ''}>${esc(c.name)}${c.codeHit ? ` (ตรงรหัสยา ${c.codeHit})` : ''}</option>`).join('');
    const prev = rows.slice(hdr + 1, hdr + 6);
    $('#wm', m).innerHTML = `<div class="grid2">
      <label class="f">แถวหัวตาราง<input type="number" id="wh" min="1" value="${hdr + 1}"></label>
      ${Object.keys(fields).map(k => `<label class="f">${esc(labels[k])}${required.includes(k) ? ' *' : ''}<select data-k="${k}">${opt(k)}</select></label>`).join('')}
    </div>
    <div class="sub" style="margin:10px 0 4px">ตัวอย่าง 5 แถวแรก</div>
    <div class="tw" style="max-height:200px"><table class="t"><thead><tr>${Object.keys(fields).map(k => `<th>${esc(labels[k])}</th>`).join('')}</tr></thead>
    <tbody>${prev.map(r => `<tr>${Object.keys(fields).map(k => `<td>${map[k] === undefined ? '' : esc(r[map[k]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $('#wh', m).onchange = e => { hdr = Math.max(0, Number(e.target.value) - 1); map = {}; drawMap(); };
    $$('select[data-k]', m).forEach(s => s.onchange = () => { const v = s.value; if (v === '') delete map[s.dataset.k]; else map[s.dataset.k] = Number(v); drawMap(); });
    $('#wo', m).disabled = !required.every(k => map[k] !== undefined);
  };
  const loadSheet = () => { rows = sheetRows(wb, $('#ws', m).value); hdr = guessHeader(rows); map = {}; drawMap(); };
  $('#wf', m).onchange = async e => {
    const f = e.target.files[0]; if (!f) return; fileName = f.name;
    try {
      wb = await readBook(f);
      $('#ws', m).innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join(''); $('#ws', m).disabled = false;
      // เลือกชีตที่มีรหัสยาตรงมากที่สุด
      let best = wb.SheetNames[0], bs = -1;
      for (const n of wb.SheetNames){ const r = sheetRows(wb, n); const h = guessHeader(r); const s = Math.max(0, ...colScores(r, h).map(c => c.codeHit)); if (s > bs){ bs = s; best = n; } }
      $('#ws', m).value = best; $('#we', m).textContent = ''; loadSheet();
    } catch (er){ $('#we', m).textContent = er.message; }
  };
  $('#ws', m).onchange = loadSheet;
  $('#wo', m).onclick = async () => {
    const out = [];
    for (let i = hdr + 1; i < rows.length; i++){
      const r = rows[i] || [], o = {};
      for (const k of Object.keys(map)) o[k] = r[map[k]];
      if (o.code === undefined || String(o.code).trim() === '') continue;
      o.code = String(o.code).trim().toUpperCase();
      out.push(o);
    }
    if (!out.length){ $('#we', m).textContent = 'ไม่พบข้อมูลในคอลัมน์ที่เลือก'; return; }
    const btn = $('#wo', m); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังนำเข้า';
    try { await onRows(out, m, fileName, {rows, hdr}); } catch (er){ $('#we', m).textContent = errText(er.message); btn.disabled = false; btn.textContent = 'นำเข้า'; }
  };
  return m;
}

function parseDmy(s){
  const m = String(s).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); if (!m) return null;
  let y = Number(m[3]); if (y > 2400) y -= 543;
  return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
}
function reportInfo(rows, hdr){
  const info = {from:null, to:null, stores:[]};
  for (let i = 0; i < Math.min(hdr, 15); i++){
    const txt = (rows[i] || []).map(v => String(v ?? '')).join(' ');
    const ds = [...txt.matchAll(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/g)].map(x => x[0]);
    if (/ข้อมูลวันที่|from date|ถึง|to date/i.test(txt) && ds.length >= 2){ info.from = parseDmy(ds[0]); info.to = parseDmy(ds[1]); }
  }
  // แถวชื่อ Store: มีข้อความแค่คอลัมน์แรก และเจอก่อนรายการยา / ขึ้นต้นด้วย Pharmacy
  const seen = new Set();
  for (let i = hdr + 1; i < rows.length; i++){
    const r = rows[i] || [], filled = r.filter(v => String(v ?? '').trim() !== '');
    if (filled.length === 1 && /pharmacy|store|ห้องยา|คลัง/i.test(String(filled[0]))) seen.add(norm(filled[0]));
  }
  info.stores = [...seen];
  return info;
}

const formOf = g => (g.supplier === 'tam' ? 'tam' : 'main') + (g.buy ? 'buy' : '');
const formShort = k => (FORMS.find(f => f.key === k) || {}).short || '';
function bindRound(editable){
  const st = S.cache.round, r = st.r;
  let f = 'refill';
  const showCf = r.status !== 'submitted';
  const draw = () => {
    const q = $('#lq').value.trim().toUpperCase(), src = $('#lsrc').value;
    const list = st.lines.filter(l => {
      const fin = st.edits[l.code] !== undefined ? (st.edits[l.code] === null ? l.suggest : st.edits[l.code]) : l.final;
      if (f === 'refill' && !(fin > 0) && st.edits[l.code] === undefined) return false;
      if (f === 'short' && !l.short) return false;
      if (f === 'adj' && !(l.adjust !== null && l.adjust !== l.suggest)) return false;
      if (src && formOf(l.g) !== src) return false;
      return !q || l.code.includes(q) || l.g.name.toUpperCase().includes(q);
    });
    $('#lb').innerHTML = list.length ? list.map(l => {
      const ed = st.edits[l.code];
      const val = ed !== undefined ? (ed === null ? l.suggest : ed) : l.final;
      return `<tr class="${l.short ? 'neg' : ''}"><td class="cd">${esc(l.code)}</td><td class="nm">${esc(l.g.name)}</td>
      <td class="n">${fmt(l.fixed)}</td><td class="n">${fmt(l.bf)}</td><td class="n">${l.emerg ? fmt(l.emerg) : ''}</td><td class="n">${l.ret ? fmt(l.ret) : ''}</td>
      <td class="n">${fmt(l.usage)}</td><td class="n">${fmt(l.rem)}${l.short ? ' <span class="chip short">ขาด</span>' : ''}</td>
      <td class="n">${fmt(l.suggest)}</td>
      <td class="n">${editable ? `<input class="q ${ed !== undefined || (l.adjust !== null && l.adjust !== l.suggest) ? 'chg' : ''}" type="number" min="0" step="1" value="${val}" data-c="${esc(l.code)}">` : `<b>${fmt(l.final)}</b>${l.adjust !== null && l.adjust !== l.suggest ? ' <span class="chip buy" title="เภสัชกรแก้จาก ' + fmt(l.suggest) + '">แก้</span>' : ''}`}</td>
      <td>${esc(l.g.unit || '')} <span class="sub">×${fmt(l.g.pack)}</span></td><td>${srcChips(l.g)}</td>
      ${showCf ? `<td class="n">${fmt(l.cf)}</td>` : ''}</tr>`;
    }).join('') : `<tr><td colspan="13" class="empty">ไม่มีรายการ</td></tr>`;
  };
  $$('#lf button').forEach(b => b.onclick = () => { f = b.dataset.f; $$('#lf button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#lq').oninput = draw; $('#lsrc').onchange = draw; draw();
  if (editable){
    const dirty = () => { const n = Object.keys(st.edits).length + st.adds.length; $('#sv').disabled = !n; $('#sv').textContent = n ? `บันทึกการแก้ไข (${n})` : 'บันทึกการแก้ไข'; };
    $('#lb').addEventListener('input', e => {
      const i = e.target.closest('input.q'); if (!i) return;
      const l = st.lines.find(x => x.code === i.dataset.c), v = i.value === '' ? null : Math.max(0, Math.round(Number(i.value)));
      const orig = l.adjust ?? l.suggest;
      if (v === orig || (v === null && l.adjust === null)) delete st.edits[l.code]; else st.edits[l.code] = v === l.suggest ? null : v;
      i.classList.add('chg'); dirty();
    });
    const pk = bindPicker('ap2');
    $('#aadd').onclick = () => {
      if (!pk.code) return toast('เลือกยาจากรายการก่อน', true);
      const q = Math.round(Number($('#aq').value)); if (!(q > 0)) return toast('ใส่จำนวนหน่วยเบิก', true);
      const ex = st.lines.find(l => l.code === pk.code);
      if (ex){ st.edits[ex.code] = q; } else { st.adds.push({code: pk.code, qty: q}); const g = drug(pk.code); st.lines.push({code: pk.code, g, fixed:0, bf:0, emerg:0, ret:0, usage:0, K:0, rem:0, short:false, suggest:0, adjust:q, final:q, cf:null}); st.lines.sort((a,b) => a.code.localeCompare(b.code)); }
      pk.clear(); $('#aq').value = ''; dirty(); draw(); toast('เพิ่มแล้ว อย่าลืมกดบันทึก');
    };
    const save = async () => {
      const changes = {}; for (const [c, v] of Object.entries(st.edits)) changes[c] = v;
      if (!Object.keys(changes).length && !st.adds.length) return true;
      await api('saveAdjust', {id: r.id, changes, add: st.adds});
      return true;
    };
    $('#sv').onclick = async () => { try { await save(); toast('บันทึกแล้ว'); render(); } catch (e){ toast(errText(e.message), true); } };
    $('#ap').onclick = async () => {
      const n = st.lines.filter(l => { const ed = st.edits[l.code]; const v = ed !== undefined ? (ed === null ? l.suggest : ed) : l.final; return v > 0; }).length;
      if (!confirm(`อนุมัติรอบเบิก #${r.id} จำนวน ${n} รายการ?\nระบบจะบันทึกยอดยกไปของห้องยาทันที และแก้ยอดไม่ได้อีก`)) return;
      try { await save(); await api('approve', {id: r.id}); toast('อนุมัติแล้ว'); render(); } catch (e){ toast(errText(e.message), true); }
    };
    window.onbeforeunload = () => (Object.keys(st.edits).length || st.adds.length) ? 'มีการแก้ไขที่ยังไม่บันทึก' : undefined;
  } else window.onbeforeunload = null;
  const cx = $('#cx'); if (cx) cx.onclick = async () => { if (!confirm('ยกเลิกรอบเบิกนี้? ยอดฉุกเฉิน/คืนที่รวมไว้จะกลับไปรอรอบถัดไป')) return; try { await api('cancelRound', {id: r.id}); toast('ยกเลิกแล้ว'); go(`#/room/${encodeURIComponent(r.room)}/rounds`); } catch (e){ toast(errText(e.message), true); } };
  const rc = $('#rc'); if (rc) rc.onclick = async () => { if (!confirm('ยืนยันว่าได้รับยาครบตามใบเบิกแล้ว?')) return; try { await api('receive', {id: r.id}); toast('บันทึกรับยาแล้ว'); render(); } catch (e){ toast(errText(e.message), true); } };
}

  }
  if (tab === 'rooms'){
    return [head + `<div class="card"><h3>ห้องยา</h3><div class="tw"><table class="t"><thead><tr><th>รหัส</th><th>ชื่อที่แสดง</th><th>ลำดับ</th><th>ใช้งาน</th><th></th></tr></thead><tbody>
      ${S.allRooms.map(r => `<tr><td class="cd">${esc(r.code)}</td><td><input type="text" value="${esc(r.name)}" data-f="name"></td><td><input type="number" value="${r.sort}" data-f="sort" style="width:70px"></td><td><input type="checkbox" data-f="active" ${r.active ? 'checked' : ''}></td><td><button class="btn sm" data-code="${esc(r.code)}">บันทึก</button></td></tr>`).join('')}
      <tr><td><input type="text" id="nrc" placeholder="รหัส" style="width:80px"></td><td><input type="text" id="nrn" placeholder="ชื่อห้องยา"></td><td><input type="number" id="nrs" value="${S.allRooms.length + 1}" style="width:70px"></td><td></td><td><button class="btn sm pri" id="nra">เพิ่มห้อง</button></td></tr>
      </tbody></table></div></div>`, () => {
        $$('button[data-code]').forEach(b => b.onclick = async () => { const tr = b.closest('tr'); try { await api('setRoom', {code: b.dataset.code, name: $('[data-f=name]', tr).value, sort: Number($('[data-f=sort]', tr).value), active: $('[data-f=active]', tr).checked}); toast('บันทึกแล้ว'); S.user = null; render(); } catch (e){ toast(errText(e.message), true); } });
        $('#nra').onclick = async () => { try { await api('setRoom', {code: $('#nrc').value.trim(), name: $('#nrn').value.trim(), sort: Number($('#nrs').value)}); toast('เพิ่มแล้ว'); S.user = null; render(); } catch (e){ toast(errText(e.message), true); } };
      }];
  }
  // drugs
  return [head + `<div class="card">
    <div class="row"><div class="grow"><h3 style="margin:0">รายการยาหลัก</h3><div class="sub">${S.drugs.size.toLocaleString()} รายการ · "หน่วยจ่าย/หน่วยเบิก" = จำนวนหน่วยจ่ายใน 1 หน่วยเบิก (คอลัมน์ D ใน Excel เดิม)</div></div>
    <button class="btn" id="di">นำเข้าจาก Excel</button><button class="btn" id="dx">ส่งออก Excel</button><button class="btn pri" id="dn">＋ เพิ่มยา</button></div>
  </div>
  ${S.drugs.size === 0 ? `<div class="card" style="border-color:var(--pri)"><h3>เริ่มต้นใช้งาน: ยังไม่มีรายการยา</h3>
    <p class="sub" style="margin:0 0 10px">โหลดรายการยาตั้งต้นจากไฟล์ Fixed stock PHAR 3 (2,867 รายการ พร้อมหน่วยเบิก จำนวนต่อหน่วย และแหล่ง TAM/ขอซื้อ) แล้วค่อยแก้หรือนำเข้าเพิ่มภายหลัง</p>
    <button class="btn pri" id="dseed">โหลดรายการยาตั้งต้น</button></div>` : ''}
  <div class="card" style="padding:0">
    <div class="row" style="padding:12px"><input type="search" id="dq" placeholder="ค้นหารหัส/ชื่อยา" class="grow">
      <select id="dsf"><option value="">ทุกแหล่ง</option>${FORMS.map(f => `<option value="${f.key}">${f.short}</option>`).join('')}<option value="off">ปิดใช้งาน</option></select><span class="sub" id="dc"></span></div>
    <div class="tw" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="t"><thead><tr><th>รหัส</th><th class="hide-m">รหัส PS</th><th>รายการ</th><th>หน่วยเบิก</th><th class="n">หน่วยจ่าย/หน่วยเบิก</th><th>แหล่ง</th><th></th></tr></thead><tbody id="db"></tbody></table></div>
  </div>`, bindDrugs];
}
function bindDrugs(){
  const draw = () => {
    const q = $('#dq').value.trim().toUpperCase(), sf = $('#dsf').value;
    let list = [...S.drugs.values()].filter(d => (sf === 'off' ? !d.active : (!sf || (d.active && formOf(d) === sf))) && (!q || d.code.includes(q) || d.name.toUpperCase().includes(q)));
    list.sort((a,b) => a.code.localeCompare(b.code));
    $('#dc').textContent = `${list.length.toLocaleString()} รายการ`;
    const show = list.slice(0, 300);
    $('#db').innerHTML = show.map(d => `<tr class="${d.active ? '' : 'neg'}"><td class="cd">${esc(d.code)}</td><td class="hide-m">${esc(d.ps_code || '')}</td><td class="nm">${esc(d.name)}</td><td>${esc(d.unit || '')}</td><td class="n">${fmt(d.pack)}</td><td>${srcChips(d)}${d.active ? '' : ' <span class="chip st-cancelled">ปิด</span>'}</td><td><button class="btn sm" data-c="${esc(d.code)}">แก้ไข</button></td></tr>`).join('') + (list.length > 300 ? `<tr><td colspan="7" class="empty">แสดง 300 จาก ${list.length.toLocaleString()} รายการ — พิมพ์ค้นหาเพื่อกรอง</td></tr>` : '');
  };
  $('#dq').oninput = draw; $('#dsf').onchange = draw; draw();
  $('#db').onclick = e => { const b = e.target.closest('button[data-c]'); if (b) drugModal(S.drugs.get(b.dataset.c)); };
  $('#dn').onclick = () => drugModal(null);
  const sd = $('#dseed'); if (sd) sd.onclick = async () => {
    sd.disabled = true; sd.innerHTML = '<span class="spin"></span> กำลังโหลด';
    try {
      const j = await (await fetch('seed-drugs.json', {cache:'no-store'})).json();
      const rows = j.rows.map(r => Object.fromEntries(j.cols.map((c, i) => [c, r[i]])));
      for (let i = 0; i < rows.length; i += 1500) await api('importDrugs', {rows: rows.slice(i, i + 1500)});
      toast(`โหลด ${rows.length.toLocaleString()} รายการแล้ว`); S.user = null; render();
    } catch (e){ toast(errText(e.message), true); sd.disabled = false; sd.textContent = 'โหลดรายการยาตั้งต้น'; }
  };
  $('#dx').onclick = () => exportXlsx('รายการยา.xlsx', [['รหัส','รหัส PS','รายการ','หน่วยจ่าย/หน่วยเบิก','หน่วยเบิก','แหล่ง','ขอซื้อ','ใช้งาน'], ...[...S.drugs.values()].map(d => [d.code, d.ps_code, d.name, d.pack, d.unit, d.supplier === 'tam' ? 'TAM' : 'คลัง', d.buy ? 'Y' : '', d.active ? 'Y' : 'N'])]);
  $('#di').onclick = () => importWizard({
    title: 'นำเข้ารายการยาจาก Excel',
    fields: {code: /รหัส|code/i, ps_code: /\(PS\)|รหัส PS/i, name: [/รายละเอียด|ชื่อ/i, /name/i], pack: [/จำนวน\/หน่วย|ต่อหน่วย/i, /pack/i], unit: [/^หน่วย(จ่าย|นับ|เบิก)?$/i, /uom|unit/i], supplier: /แหล่ง|^tam$|supplier/i, buy: /ขอซื้อ|buy/i},
    labels: {code:'รหัสยา', ps_code:'รหัส PS', name:'ชื่อ/รายละเอียด', pack:'หน่วยจ่าย/หน่วยเบิก', unit:'หน่วยเบิก', supplier:'แหล่ง (TAM/คลัง)', buy:'ขอซื้อ (Y)'},
    required: ['code','name'],
    note: 'รหัสที่มีอยู่แล้วจะถูกอัปเดต รหัสใหม่จะถูกเพิ่ม · คอลัมน์แหล่ง: มีค่า (เช่น TAM) = ไทยแอมดอน, ว่าง/คลัง = คลังยา · ขอซื้อ: Y/1/TRUE',
    extra: '<label class="row" style="margin-top:10px;font-size:14px"><input type="checkbox" id="wk" checked> ไม่เปลี่ยนแหล่ง/ขอซื้อของยาที่มีอยู่แล้ว (อัปเดตเฉพาะชื่อ หน่วย จำนวนต่อหน่วย)</label>',
    onRows: async (rows, m) => {
      const yes = v => /^(y|yes|1|true|ใช่|✓)$/i.test(String(v ?? '').trim());
      const isTam = v => { const t = String(v ?? '').trim(); return t !== '' && !/^(คลัง|คลังยา|main|0|n|no|false|-)$/i.test(t); };
      const payload = rows.map(r => ({code: r.code, ps_code: r.ps_code, name: r.name, pack: r.pack, unit: r.unit, supplier: isTam(r.supplier) ? 'tam' : 'main', buy: yes(r.buy)}));
      let n = 0;
      for (let i = 0; i < payload.length; i += 1500){ const x = await api('importDrugs', {rows: payload.slice(i, i + 1500), keepFlags: $('#wk', m).checked}); n += x.n; }
      m.close(); toast(`นำเข้า ${n.toLocaleString()} รายการ`); S.user = null; render();
    }
  });
}
function drugModal(d){
  const isNew = !d; d = d || {code:'', ps_code:'', name:'', pack:1, unit:'', supplier:'main', buy:false, active:true};
  const m = modal(`<h2>${isNew ? 'เพิ่มยา' : 'แก้ไขยา ' + esc(d.code)}</h2>
    <form id="dm" class="grid2">
      <label class="f">รหัสยา *<input type="text" id="d_code" value="${esc(d.code)}" ${isNew ? '' : 'readonly'} required></label>
      <label class="f">รหัส PS<input type="text" id="d_ps" value="${esc(d.ps_code || '')}"></label>
      <label class="f" style="grid-column:1/-1">ชื่อ/รายละเอียด *<input type="text" id="d_name" value="${esc(d.name)}" required></label>
      <label class="f">หน่วยเบิก (หน่วยนับบนใบเบิก)<input type="text" id="d_unit" value="${esc(d.unit || '')}"></label>
      <label class="f">หน่วยจ่าย ต่อ 1 หน่วยเบิก<input type="number" id="d_pack" value="${d.pack}" min="0.0001" step="any"></label>
      <label class="f">แหล่งเบิก<select id="d_sup"><option value="main" ${d.supplier !== 'tam' ? 'selected' : ''}>คลังยา</option><option value="tam" ${d.supplier === 'tam' ? 'selected' : ''}>TAM (ไทยแอมดอน)</option></select></label>
      <div style="display:flex;flex-direction:column;gap:6px;justify-content:flex-end">
        <label class="row" style="font-size:14px"><input type="checkbox" id="d_buy" ${d.buy ? 'checked' : ''}> ขอซื้อ (แยกใบขอซื้อ)</label>
        <label class="row" style="font-size:14px"><input type="checkbox" id="d_act" ${d.active ? 'checked' : ''}> ใช้งาน</label></div>
      <div class="row end" style="grid-column:1/-1"><button type="button" class="btn" id="dmc">ยกเลิก</button><button class="btn pri">บันทึก</button></div>
    </form>`);
  $('#dmc', m).onclick = () => m.close();
  $('#dm', m).onsubmit = async e => {
    e.preventDefault();
    try {
      await api('setDrug', {drug: {code: $('#d_code', m).value, ps_code: $('#d_ps', m).value.trim(), name: $('#d_name', m).value, unit: $('#d_unit', m).value.trim(), pack: Number($('#d_pack', m).value), supplier: $('#d_sup', m).value, buy: $('#d_buy', m).checked, active: $('#d_act', m).checked}});
      m.close(); toast('บันทึกแล้ว'); S.user = null; render();
    } catch (er){ toast(errText(er.message), true); }
  };
}

render();
</script>
</body>
</html>
